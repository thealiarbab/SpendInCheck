{% extends "base.html" %}
{% block title %}Sign in &mdash; SpendInCheck{% endblock %}

{% block content %}
<div class="signin-wrap">
  <span class="pill pill-brand">Welcome back</span>
  <h1 class="signin-title">Sign in.</h1>
  <p class="signin-sub">Open your transactions, budgets and portfolio.</p>

  <form method="post" class="signin-form">
    <label for="login">Username or email</label>
    <input type="text" id="login" name="login" autofocus required
           autocomplete="username" placeholder="aliarbab">

    <label for="password" style="margin-top:14px">Password</label>
    <input type="password" id="password" name="password" required
           autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">

    <button type="submit" class="signin-btn">Sign in &rarr;</button>
  </form>

  <div class="signin-alt">No account yet? <a href="{{ url_for('register') }}">Create one</a>
    &nbsp;&middot;&nbsp;
    <form class="inline" method="post" action="{{ url_for('demo_login') }}">
      <button type="submit" class="linkish">Try the demo</button>
    </form>
  </div>
  <a class="signin-back" href="{{ url_for('landing') }}">&larr; Back to the front page</a>
</div>
{% endblock %}
