# Supabase pauses free projects after 7 days without activity, and a paused
# project has to be restored by hand. The three daily Vercel crons already
# query the database; this is the backstop in case they stop, twice a week.
#
# It calls the app's own /api/v1/cron/recurring job instead of connecting to
# Postgres directly. The first version of this workflow opened a psycopg2
# connection using DB_* repo secrets that were never set, so it failed with
# `int('')` on every run it ever made. Going through the app needs one secret
# (CRON_SECRET, the same value as the Vercel env var) instead of five, and it
# also proves the deployed API can reach the database, which is the thing
# that actually matters. The job is idempotent: a unique index on
# (rule_id, txn_date) makes a repeat run a no-op.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 * * 1,4"   # Mondays and Thursdays, 06:00 UTC
  workflow_dispatch:         # also runnable manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — secret must be configured
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret is not set (must match the Vercel env var)."
            exit 1
          fi

      - name: Run a job that touches the database
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://spendincheck.com/api/v1/cron/recurring) || code=000
          echo "HTTP $code: $(head -c 300 /tmp/out.json)"
          [ "$code" = "200" ] || { echo "::error::keep-alive request failed (HTTP $code)"; exit 1; }
