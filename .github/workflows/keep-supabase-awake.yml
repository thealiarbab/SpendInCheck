# Supabase pauses free projects after 7 days without activity, and a paused
# project has to be restored by hand. This runs a trivial query twice a week
# so the project never goes idle long enough to be paused.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 * * 1,4"   # Mondays and Thursdays, 06:00 UTC
  workflow_dispatch:         # also runnable manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install psycopg2-binary

      - name: Run a keep-alive query
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python - <<'PY'
          import os, psycopg2
          conn = psycopg2.connect(
              host=os.environ["DB_HOST"], port=int(os.environ["DB_PORT"]),
              user=os.environ["DB_USER"], password=os.environ["DB_PASSWORD"],
              dbname=os.environ["DB_NAME"], sslmode="require", connect_timeout=20,
          )
          cur = conn.cursor()
          cur.execute("SELECT COUNT(*) FROM categories")
          print("keep-alive ok, categories:", cur.fetchone()[0])
          conn.close()
          PY
